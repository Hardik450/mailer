<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Sender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center;
    }
    form { margin-top: 20px; width: 350px; }
    input, textarea {
      width: 100%; padding: 8px; margin-top: 10px; margin-bottom: 15px;
    }
    button {
      width: 100%; padding: 10px;
      background-color: #007bff; color: white; border: none;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    .msg { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Send an Email</h2>

  <form id="emailForm">
    <input type="email" id="receiver_email" placeholder="Receiver Email" required />
    <input type="text" id="subject" placeholder="Subject" required />
    <textarea id="body_text" placeholder="Message" rows="5" required></textarea>
    <button type="submit">Send Email</button>
  </form>

  <div id="message" class="msg"></div>
  <script>
    document.getElementById('emailForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        recipient_list: document.getElementById('receiver_email').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('body_text').value
      };

      const messageBox = document.getElementById('message');
      messageBox.textContent = 'Sending…';

      try {
        const response = await fetch('/mailer/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (response.status === 200) {
          messageBox.style.color = 'green';
          messageBox.textContent = data.success || 'Email sent successfully!';
        } else {
          messageBox.style.color = 'red';
          messageBox.textContent = data.error || 'Error sending email.';
        }
      } catch (error) {
        messageBox.textContent = 'Error sending email.';
      }
      
      
    });
    </script>
</body>
</html>
